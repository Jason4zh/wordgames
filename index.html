<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0a1020">
<title>单词游乐场</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="top">
    <div class="brand">
      <span class="logo">🎯</span>
      <div>
        <b>单词游乐场</b>
        <small>81 本词书 · Wordle · 填空 · 拼图 · 找词 · 配对 · 下落</small>
      </div>
    </div>
    <div class="stats">
      <span class="chip" id="chipStreak">🔥 0</span>
      <button class="icon" data-act="settings" aria-label="设置">⚙️</button>
    </div>
  </div>

  <div id="stage"></div>

  <div class="tabs" id="tabs"></div>

  <div class="sheet" id="sheet"></div>
  <div class="toast" id="toast"></div>

<script src="banks/meta.js"></script>
<script src="banks/idx.js"></script>
<!-- 搜索索引：23881 词的 [词库id, 释义摘要]，供搜索页使用 -->
<script src="banks/sidx.js"></script>
<!-- 词库按需加载：选中哪本才载入 banks/<id>.js，避免首屏加载上百 MB -->
<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
